[functions.create-booking]
enabled = true
# Public intake; validation, rate limits and constraints run in the handler and DB.
verify_jwt = false
import_map = "./functions/create-booking/deno.json"
entrypoint = "./functions/create-booking/index.ts"

[functions.send-booking-email]
enabled = true
# getUser() verifies user tokens in code; is_staff() authorizes access.
# Gateway verification stays off to support publishable API keys.
verify_jwt = false
import_map = "./functions/send-booking-email/deno.json"
entrypoint = "./functions/send-booking-email/index.ts"
